# =============================================================================
# Nginx configuration for parametric-memory.dev
# =============================================================================
# Reverse proxy to Next.js (port 3000), SSL termination via Let's Encrypt,
# security headers from security audit (2026-03-09).
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name parametric-memory.dev www.parametric-memory.dev;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://parametric-memory.dev$request_uri;
    }
}

# Redirect www → non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.parametric-memory.dev;

    ssl_certificate /etc/letsencrypt/live/parametric-memory.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parametric-memory.dev/privkey.pem;

    # HSTS on the redirect itself (2026-09-10). hstspreload.org requires that
    # redirects also serve the HSTS header, and this site is ON the preload
    # list. Measured before the fix: `curl -sI https://www.parametric-memory.dev/`
    # returned `HTTP/2 301` with NO strict-transport-security — this block is a
    # bare `return 301` with no add_header, so it inherited nothing from
    # anywhere. Must match the apex header below verbatim.
    # Regression test: src/nginx-security-headers.test.ts.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://parametric-memory.dev$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parametric-memory.dev;

    # --- SSL Configuration ---
    ssl_certificate /etc/letsencrypt/live/parametric-memory.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parametric-memory.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling — REMOVED 2026-09-10, it had been dead config.
    # Let's Encrypt dropped OCSP URLs from issued certificates on 2025-05-07
    # and shut its OCSP responders down on 2025-08-06, replacing OCSP with
    # CRLs (letsencrypt.org/2025/08/06/ocsp-service-has-reached-end-of-life).
    # Our certificates therefore carry no OCSP URL and stapling cannot occur,
    # so `ssl_stapling on; ssl_stapling_verify on;` were no-ops. The
    # `resolver 1.1.1.1 8.8.8.8` / `resolver_timeout` pair existed only to
    # serve those stapling lookups — every proxy_pass here targets the
    # literal 127.0.0.1, so nothing else in this file needs a resolver.
    # Do not restore without first confirming the CA issues OCSP again.

    # --- Security Headers ---
    # OWNERSHIP (2026-09-10): the APP owns X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy and Permissions-Policy — next.config.ts
    # headers() sets all four on source "/(.*)", and
    # src/app/__tests__/seo-headers.test.ts:61 pins them ("preserves the
    # existing security headers — no regression"). nginx used to set the same
    # four here, so every response carried them TWICE: measured live on the
    # homepage before this fix —
    #     x-frame-options:        DENY, DENY
    #     x-content-type-options: nosniff, nosniff
    #     referrer-policy:        strict-origin-when-cross-origin, strict-origin-…
    #     permissions-policy:     camera=(), … , camera=(), …
    # A repeated X-Content-Type-Options is not spec-valid ("nosniff" must be
    # the whole value), and browsers may discard a multi-valued X-Frame-Options
    # outright — so the duplication risked DISABLING the very protections it
    # looked like it was doubling. Removed here; the app remains the single
    # owner. nginx keeps only the three the app does NOT set.
    # Regression test: src/nginx-wellknown-jwks.test.ts.
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP — extended for Stripe Embedded Checkout (sprint 2026-05-18, P0-4):
    #   frame-src   — js.stripe.com (always), checkout.stripe.com (Embedded
    #                 Checkout iframe), hooks.stripe.com (3-D Secure challenge
    #                 modal). Without checkout.stripe.com here the browser
    #                 blocks the <EmbeddedCheckout> iframe silently.
    #   connect-src — api.stripe.com (Stripe.js → REST API),
    #                 merchant-ui-api.stripe.com (Embedded Checkout calls),
    #                 mmpm.co.nz (our memory backend).
    # frame-src — youtube-nocookie.com added 2026-08-17: the /videos/[slug]
    #   pages (shipped 2026-07-13, src/lib/videos.ts) embed
    #   https://www.youtube-nocookie.com/embed/<id> in an <iframe>. That
    #   domain was never added here, so every video page rendered "This
    #   content is blocked. Contact the site owner to fix the issue." — the
    #   browser silently enforcing this CSP, not a YouTube-side block.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.stripe.com https://merchant-ui-api.stripe.com https://mmpm.co.nz wss://mmpm.co.nz; frame-src 'self' https://js.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://www.youtube-nocookie.com; frame-ancestors 'none';" always;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # --- Rate Limiting ---
    # Define in http block:
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # limit_req_zone $binary_remote_addr zone=webhooks:10m rate=5r/s;

    # --- Reverse Proxy to Next.js ---
    # X-Forwarded-For is OVERWRITTEN, not appended (changed 2026-09-10).
    # It used to be `$proxy_add_x_forwarded_for`, which APPENDS $remote_addr to
    # whatever the client sent. src/lib/rate-limit.ts `clientIp()` reads the
    # LEFTMOST value, so a request carrying `X-Forwarded-For: 1.2.3.4` arrived
    # as "1.2.3.4, <real ip>" and the limiter keyed on 1.2.3.4 — attacker
    # controlled. Rotating that header defeated the per-IP limits on
    # /api/waitlist and /api/verify/fetch-snapshot entirely, and
    # src/lib/compute-proxy.ts forwarded the same poisoned value upstream, so
    # any per-IP logic in compute inherited it. rate-limit.ts flags this in its
    # own header comment ("spoofable by a direct caller").
    #
    # nginx is the edge here, so the true peer is $remote_addr and there is no
    # upstream chain worth preserving. IF CLOUDFLARE IS EVER PUT IN FRONT this
    # must become $http_cf_connecting_ip — $remote_addr would then be
    # Cloudflare's IP and every client would share one rate-limit bucket.
    # Regression test: src/nginx-forwarded-for.test.ts.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Static assets caching ---
    # HEADER INHERITANCE TRAP (2026-09-10): this location declares its own
    # add_header, and per the nginx docs add_header directives "are inherited
    # from the previous configuration level if and only if there are no
    # add_header directives defined on the current level". So the server-level
    # security headers above are NOT inherited here — measured live, every
    # /_next/static/* response was missing Content-Security-Policy,
    # Strict-Transport-Security and X-XSS-Protection. It looked survivable only
    # because next.config.ts backfills the other four at the app layer.
    # Anything nginx owns must therefore be REPEATED in this block.
    #
    # Content-Security-Policy is DELIBERATELY NOT repeated here. CSP governs a
    # document's own fetches; it has no effect on the response carrying a .js
    # or .css subresource, so repeating a 434-byte header on every static asset
    # would cost bandwidth and buy nothing. HSTS and X-XSS-Protection ARE
    # repeated: HSTS is processed by the UA on any HTTPS response (RFC 6797),
    # and keeping X-XSS-Protection uniform avoids a confusing partial set.
    # If you add a FOURTH nginx-owned header above, decide consciously whether
    # it belongs here too — do not assume.
    #
    # `expires` + the Cache-Control add_header are deliberately left as-is:
    # measured live they combine to `max-age=31536000, public, immutable`,
    # which is valid and correct. Changing them is not part of this fix.
    # Regression test: src/nginx-security-headers.test.ts.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # NOTE (2026-08-24): the old `location /brand/` block is GONE — do not
    # bring it back. It pointed at `root /var/www/parametric-memory/public`,
    # a path that does not exist on the droplet (the deploy checkout lives at
    # /home/deploy/parametric-memory-web and the app runs inside Docker).
    # The block was harmless for months only because this file was never
    # applied to the live server; the deploy nginx-sync step (af9a16a,
    # 2026-08-23) applied it for the first time and every /brand/* asset —
    # site logo, favicons, og.png social cards, the JSON-LD Organization
    # logo — started returning 404. /brand/* now falls through to
    # `location /` and is proxied to the app, which serves it from public/
    # inside the container (same path as /llms.txt and /site.webmanifest,
    # which never broke). The 30-day Cache-Control the block used to add now
    # comes from next.config.ts headers() for /brand/:path*.
    # Regression test: nginx-brand-assets.test.ts.

    # --- Published well-known documents (MUST precede the dotfile deny) ---
    # NOTE (2026-09-10): `.well-known` is a dot-directory, so the
    # `location ~ /\.` deny block below matches it and returns 404. That is
    # how https://parametric-memory.dev/.well-known/jwks.json stopped
    # answering — the same af9a16a (2026-08-23) nginx-sync deploy that broke
    # /brand/* (see the note above) applied this file live for the first time
    # and took the JWKS endpoint down with it. The /brand/* breakage was
    # visible and got fixed; this one was silent, because an unreachable JWKS
    # does not fail a verification — it degrades it to
    # keySource=embedded-fallback-jwks-unreachable. Proven by same-file A/B:
    # a snapshot that verified with keySource=jwks on 2026-07-17 reported the
    # fallback on 2026-09-10, same machine, same verifier, same bytes.
    #
    # Impact while broken: the compute provisioner passes
    # MMPM_JWKS_URI=https://parametric-memory.dev/.well-known/jwks.json into
    # EVERY provisioned customer substrate, so every customer's verifier was
    # falling back, and the JWKS-reachable guarantees (key revocation, and
    # the embedded-vs-published key byte-comparison that catches a forged or
    # replayed snapshot) were all inactive.
    #
    # `^~` is load-bearing: a prefix location with `^~` suppresses regex
    # location matching entirely, so this wins over `location ~ /\.` below.
    # A plain `location /.well-known/` would NOT — regex locations otherwise
    # take precedence over prefix locations.
    #
    # Proxied to the app, never served from a filesystem root — the /brand/
    # lesson above. The app serves it from public/.well-known/ inside the
    # container, and next.config.ts headers() adds the ACAO + Cache-Control
    # the cross-origin verifier fetch requires.
    # Regression test: src/nginx-wellknown-jwks.test.ts.
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- Block sensitive paths ---
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ ^/(\.env|docker-compose|Dockerfile) {
        deny all;
        return 404;
    }
}
